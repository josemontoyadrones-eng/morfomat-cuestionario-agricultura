<style>
:root{--green:#174c37;--green2:#236b4b;--bg:#f3f6f3;--ink:#17231c;--muted:#64736a;--line:#dce5de;--good:#e4f5e9;--bad:#fff0ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,#123b2b,#28734f);color:white;padding:24px 18px 28px}.wrap{max-width:760px;margin:auto}header .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}h1{font-size:clamp(24px,5vw,34px);line-height:1.12;margin:9px 0}header p{margin:8px 0 0;color:#e3efe7}
main{max-width:760px;margin:18px auto;padding:0 14px 36px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #193c2710}
.stats{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;margin-bottom:12px}.track{height:8px;background:#e8eee9;border-radius:99px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:#2c8057;width:0%;transition:width .2s}
.kicker{font-size:12px;font-weight:800;color:var(--green2);text-transform:uppercase;letter-spacing:.08em}h2{font-size:21px;line-height:1.35;margin:10px 0 18px}.options{display:grid;gap:10px}
.option{width:100%;text-align:left;border:1.5px solid var(--line);background:white;border-radius:13px;padding:14px;display:flex;gap:12px;align-items:flex-start;font:inherit;color:var(--ink);cursor:pointer}.option:focus-visible,button:focus-visible{outline:3px solid #8cc7a5;outline-offset:2px}.letter{flex:0 0 30px;height:30px;border-radius:9px;background:#edf3ee;color:var(--green);font-weight:800;display:grid;place-items:center}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#3c9b61;background:var(--good)}.option.wrong{border-color:#d56c5d;background:var(--bad)}
.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5;font-size:14px}.feedback.show{display:block}.feedback.good{background:var(--good);border:1px solid #b7dfc2}.feedback.bad{background:var(--bad);border:1px solid #f0c4bc}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}button.primary{border:0;background:var(--green);color:white;border-radius:12px;padding:13px 20px;font-weight:750;font-size:15px;cursor:pointer}button.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:13px;color:var(--muted);line-height:1.5}.intro{text-align:center;padding:8px 0 2px}.intro h2{font-size:24px}.pill{display:inline-block;background:#edf4ef;color:var(--green);padding:6px 10px;border-radius:99px;font-size:12px;font-weight:800}.result{text-align:center}.score{font-size:54px;font-weight:850;color:var(--green);line-height:1.1;margin:16px 0 6px}.review{margin-top:18px;text-align:left}.review details{border-top:1px solid var(--line);padding:12px 0}.review summary{font-weight:700;cursor:pointer;line-height:1.4}.review p{font-size:14px;line-height:1.5;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(min-width:600px){.panel{padding:26px}.option:hover:not(:disabled){border-color:#86b69a;background:#fbfdfb}}

<header><div class="wrap"><div class="tag">MORFOMAT Ingeniería S.A.S.</div><h1>Reto de Agricultura de Precisión</h1><p>82 preguntas para aprender sobre drones, multiespectral, fotogrametría, GNSS RTK y manejo agrícola diferencial.</p></div></header>
<main><section class="panel" id="app"></section></main><footer>Material de práctica académica · MORFOMAT Ingeniería S.A.S.</footer>
<script>
const QUESTIONS = [{"q": "¿Qué caracteriza a la agricultura de precisión frente al manejo uniforme del cultivo?", "o": ["Aplicar siempre la misma dosis en toda la finca", "Tomar decisiones diferenciadas según la variabilidad espacial y temporal", "Sustituir todas las labores de campo por drones"], "a": 1, "f": "La agricultura de precisión reconoce que el cultivo y el terreno varían y adapta el manejo a esas diferencias."}, {"q": "¿Cuál es el problema principal que busca resolver el monitoreo aéreo multiespectral?", "o": ["Localizar y caracterizar variaciones del cultivo para orientar verificaciones e intervenciones", "Medir directamente todos los nutrientes del suelo", "Determinar por sí solo el rendimiento futuro exacto"], "a": 0, "f": "Los sensores ayudan a detectar patrones y anomalías; la causa debe validarse con información agronómica."}, {"q": "¿Qué ventaja operativa ofrece un dron frente a recorrer visualmente toda una superficie extensa?", "o": ["Elimina la necesidad de agrónomos", "Diagnostica automáticamente todas las enfermedades", "Permite cubrir grandes áreas rápidamente y priorizar visitas de campo"], "a": 2, "f": "La cobertura rápida y espacialmente explícita ayuda a focalizar recorridos y ahorrar tiempo."}, {"q": "¿Qué beneficio obtiene un productor al comparar mapas de distintas fechas?", "o": ["Puede observar cambios espaciales y temporales del cultivo", "Puede conocer la causa exacta de cada cambio sin visitar el lote", "Puede omitir los registros de manejo"], "a": 0, "f": "La comparación temporal permite seguir tendencias, siempre que las capturas y el procesamiento sean comparables."}, {"q": "¿Cuál describe mejor el alcance de un proyecto de agricultura de precisión?", "o": ["Solo producir imágenes aéreas", "Monitorear, validar, zonificar y apoyar decisiones de manejo", "Aplicar automáticamente tratamientos sin diagnóstico"], "a": 1, "f": "La tecnología debe conectar adquisición de datos con validación y decisiones agronómicas."}, {"q": "¿Qué permite adaptar una metodología a cultivos permanentes y transitorios?", "o": ["Usar exactamente los mismos umbrales y fechas para todos", "Ignorar la arquitectura del cultivo", "Ajustar vuelos, índices e interpretación a especie, etapa fenológica y sistema productivo"], "a": 2, "f": "La especie, la arquitectura y la fenología condicionan la captura y la interpretación."}, {"q": "¿Qué función cumple principalmente el ingeniero agrónomo en este flujo?", "o": ["Interpretar el contexto del cultivo, validar anomalías y formular recomendaciones agronómicas", "Configurar exclusivamente la estación GNSS", "Reemplazar el procesamiento fotogramétrico"], "a": 0, "f": "La interpretación y recomendación agronómica requiere contexto de cultivo y validación en campo."}, {"q": "¿Qué hace adecuado al DJI Mavic 3 Multispectral para monitoreo agrícola?", "o": ["Tiene un sensor térmico de humedad del suelo", "Integra cámara RGB y cámaras multiespectrales en bandas visibles y red edge/infrarrojo cercano", "Mide directamente el contenido de nitrógeno de cada hoja"], "a": 1, "f": "El M3M captura información RGB y multiespectral que permite calcular índices de vegetación."}, {"q": "¿Cuáles son las cuatro bandas de las cámaras multiespectrales del Mavic 3M?", "o": ["Verde, rojo, red edge e infrarrojo cercano (NIR)", "Azul, verde, rojo y térmica", "Verde, amarillo, red edge y ultravioleta"], "a": 0, "f": "Las cuatro cámaras multiespectrales capturan verde, rojo, red edge y NIR; la cámara RGB es independiente."}, {"q": "¿Qué representa principalmente el NDVI?", "o": ["La diferencia entre temperatura de hoja y aire", "La respuesta relativa de la vegetación usando rojo y NIR", "La concentración exacta de agua en el suelo"], "a": 1, "f": "El NDVI combina reflectancia roja e infrarrojo cercano y se usa como indicador relativo de verdor/vigor."}, {"q": "¿Qué distingue al GNDVI del NDVI?", "o": ["Utiliza verde en lugar de rojo junto con NIR", "Utiliza térmico junto con rojo", "Utiliza elevación y pendiente"], "a": 0, "f": "GNDVI emplea la banda verde y NIR; NDVI utiliza rojo y NIR."}, {"q": "¿Qué distingue al NDRE?", "o": ["Compara únicamente RGB", "Combina red edge e infrarrojo cercano", "Mide la humedad volumétrica del suelo"], "a": 1, "f": "NDRE utiliza red edge y NIR y puede aportar sensibilidad en vegetación más desarrollada."}, {"q": "¿Por qué puede ser útil analizar NDVI, GNDVI y NDRE conjuntamente?", "o": ["Porque cada índice responde de forma idéntica", "Porque reemplazan el análisis de suelo", "Porque ofrecen respuestas espectrales complementarias y ayudan a caracterizar mejor la vegetación"], "a": 2, "f": "Los índices usan bandas distintas y pueden aportar información complementaria; ninguno diagnostica por sí solo."}, {"q": "¿Un NDVI de 0,8 demuestra necesariamente que el cultivo está sano?", "o": ["Sí, siempre equivale a ausencia de estrés", "No; es un valor relativo que depende de cultivo, cobertura, etapa y condiciones de captura", "Sí, porque existe un umbral universal de salud"], "a": 1, "f": "Un valor alto no garantiza ausencia de plagas, enfermedades u otros problemas; requiere contexto."}, {"q": "¿Existen umbrales universales de NDVI, GNDVI y NDRE para diagnosticar cualquier cultivo?", "o": ["Sí, son iguales para todas las especies y etapas", "Solo para cultivos frutales", "No; deben calibrarse o interpretarse según cultivo, fenología, condiciones y datos de campo"], "a": 2, "f": "Los valores dependen de múltiples factores y no existe un umbral universal de diagnóstico."}, {"q": "Un sector presenta NDVI bajo. ¿Cuál es el siguiente paso técnicamente apropiado?", "o": ["Atribuirlo directamente a falta de nitrógeno", "Validar en campo y contrastar suelo, humedad, síntomas y manejo", "Aplicar fertilizante de inmediato"], "a": 1, "f": "El índice identifica una anomalía espectral, no su causa; se requiere diagnóstico diferencial."}, {"q": "¿Puede el Mavic 3M detectar directamente una plaga específica?", "o": ["No de forma general; puede identificar patrones asociados que requieren confirmación", "Sí, identifica automáticamente especie y población de cada plaga", "Sí, porque el NDRE es un detector de insectos"], "a": 0, "f": "El sensor registra reflectancia de la vegetación, no identifica directamente organismos o agentes causales."}, {"q": "¿Por qué importa la radiación solar al capturar imágenes multiespectrales?", "o": ["No afecta la reflectancia medida", "Puede cambiar la iluminación y la respuesta registrada, dificultando comparaciones", "Solo afecta las imágenes RGB"], "a": 1, "f": "Las condiciones de iluminación influyen en la reflectancia aparente y comparabilidad."}, {"q": "¿Para qué sirve el sensor de luz solar del Mavic 3M?", "o": ["Para medir humedad del suelo", "Para corregir la altitud del vuelo", "Para registrar la iluminación incidente y apoyar la calibración radiométrica"], "a": 2, "f": "El sensor de luz solar ayuda a compensar variaciones de iluminación; no mide humedad del suelo."}, {"q": "¿Qué mejora la comparabilidad entre vuelos de diferentes fechas?", "o": ["Condiciones y configuración de captura consistentes, calibración y procesamiento controlado", "Cambiar altura y hora en cada vuelo sin registrar cambios", "Comparar índices de productos procesados con métodos distintos"], "a": 0, "f": "La consistencia de captura y calibración reduce variaciones no atribuibles al cultivo."}, {"q": "¿Qué significa GSD en un levantamiento con dron?", "o": ["La precisión vertical del GNSS", "El tamaño del terreno representado por cada píxel en el suelo", "El número de imágenes por hectárea"], "a": 1, "f": "GSD es la distancia en el terreno representada por un píxel; afecta el nivel de detalle."}, {"q": "¿Qué limitación puede aparecer en cultivos con copas densas?", "o": ["El sensor deja de registrar radiación solar", "El índice mide el suelo desnudo únicamente", "La señal puede representar principalmente la parte superior de la copa y ocultar condiciones internas"], "a": 2, "f": "La teledetección óptica observa superficies visibles y no necesariamente el interior de copas densas."}, {"q": "¿Qué es la fotogrametría?", "o": ["Obtener mediciones y productos 3D/2D a partir de fotografías con geometría y solape conocidos", "Medir directamente nutrientes foliares con una cámara", "Calcular el caudal de riego desde imágenes térmicas"], "a": 0, "f": "La fotogrametría reconstruye geometría y productos cartográficos a partir de imágenes."}, {"q": "¿Qué es un ortomosaico?", "o": ["Una fotografía sin corrección geométrica", "Un mosaico de imágenes corregido geométricamente y georreferenciado", "Un modelo de humedad del suelo"], "a": 1, "f": "El ortomosaico combina imágenes corregidas para medir y ubicar elementos en planta."}, {"q": "¿Qué diferencia general hay entre MDS y MDT?", "o": ["MDS representa superficies visibles, incluidos objetos; MDT busca representar el terreno desnudo", "MDS siempre representa terreno desnudo y MDT árboles", "Son productos idénticos"], "a": 0, "f": "El MDS incluye copas, edificios y otros objetos; el MDT representa el terreno."}, {"q": "¿Cómo puede la fotogrametría mejorar la eficiencia operativa?", "o": ["Evita toda inspección agronómica", "Permite levantar superficies rápidamente y dirigir las visitas a zonas prioritarias", "Garantiza que nunca habrá errores de campo"], "a": 1, "f": "La cobertura rápida y los mapas permiten focalizar recorridos, aunque no sustituyen validación."}, {"q": "¿Por qué incorporar GNSS RTK a un levantamiento fotogramétrico?", "o": ["Para medir directamente clorofila", "Para sustituir la cámara del dron", "Para obtener coordenadas precisas de control y mejorar la georreferenciación"], "a": 2, "f": "RTK aporta posicionamiento de puntos de control y georreferenciación de alta precisión."}, {"q": "¿Qué diferencia básica existe entre GNSS convencional y RTK?", "o": ["RTK utiliza correcciones en tiempo real para mejorar la precisión de posicionamiento", "GNSS convencional siempre es más preciso", "RTK no utiliza satélites"], "a": 0, "f": "RTK aplica correcciones diferenciales para mejorar la solución de posicionamiento."}, {"q": "¿Qué describe mejor PPK frente a RTK?", "o": ["PPK corrige posiciones después de la captura usando datos registrados", "PPK es una cámara multiespectral", "PPK mide reflectancia foliar"], "a": 0, "f": "PPK realiza el procesamiento diferencial posterior, mientras RTK aplica correcciones durante el levantamiento."}, {"q": "¿Qué precisión suele asociarse a GNSS RTK en condiciones adecuadas?", "o": ["Siempre milimétrica en todo producto fotogramétrico", "Centimétrica en el posicionamiento, según equipo, método y condiciones", "Metros en cualquier circunstancia"], "a": 1, "f": "RTK suele ofrecer precisión centimétrica en coordenadas; eso no garantiza precisión milimétrica del ortomosaico."}, {"q": "¿Por qué no debe prometerse precisión milimétrica en todo el ortomosaico solo por usar RTK?", "o": ["Porque RTK no mejora coordenadas", "Porque el error final depende también de geometría, GCP, cámara, procesamiento y verificación", "Porque los ortomosaicos no tienen escala"], "a": 1, "f": "La precisión del producto depende de toda la cadena y debe evaluarse con puntos independientes."}, {"q": "¿Para qué sirven los GCP?", "o": ["Para proporcionar control posicional al ajuste fotogramétrico", "Para medir la clorofila de las hojas", "Para calcular directamente la evapotranspiración"], "a": 0, "f": "Los puntos de control terrestre ayudan a ajustar y georreferenciar el bloque fotogramétrico."}, {"q": "¿Qué diferencia hay entre GCP y punto de verificación independiente?", "o": ["No hay diferencia", "El punto de verificación se usa para ajustar el modelo", "Los GCP ayudan al ajuste; los puntos independientes evalúan la exactitud sin participar en él"], "a": 2, "f": "Los puntos independientes permiten evaluar la exactitud sin sesgo por haber sido usados en el ajuste."}, {"q": "¿Qué es importante al distribuir puntos de control?", "o": ["Concentrarlos todos en una esquina", "Distribuirlos de manera adecuada por el área y, cuando sea posible, en elevaciones variadas", "Ubicarlos solo donde sea fácil acceder"], "a": 1, "f": "Una distribución espacial adecuada mejora la geometría y reduce deformaciones del bloque."}, {"q": "¿Qué información topográfica puede apoyar el manejo del riego?", "o": ["Pendientes, elevación, microrelieve y rutas potenciales de escorrentía", "La especie exacta de cada insecto", "El nitrógeno foliar directo"], "a": 0, "f": "El relieve influye en movimiento y acumulación superficial del agua."}, {"q": "¿Cómo se pueden identificar zonas potenciales de acumulación de agua?", "o": ["Solo mediante NDRE", "Analizando microrelieve, depresiones y rutas de flujo, y verificando en campo", "Usando únicamente el conteo de árboles"], "a": 1, "f": "Los modelos de elevación ayudan a localizar depresiones y rutas potenciales, que deben validarse."}, {"q": "¿Cuál es una limitación del MDT generado con fotogrametría óptica en vegetación densa?", "o": ["La cámara puede ver a través de cualquier copa", "El modelo siempre elimina vegetación automáticamente", "El suelo puede quedar oculto y no reconstruirse de forma confiable"], "a": 2, "f": "La fotogrametría óptica reconstruye superficies visibles; la vegetación densa puede ocultar el terreno."}, {"q": "¿Cuál es una ventaja de un levantamiento fotogramétrico frente a recorridos topográficos convencionales en áreas extensas?", "o": ["Puede capturar cobertura espacial densa con rapidez, aunque requiere control y validación", "No necesita planificación ni control", "Siempre es más preciso que cualquier método terrestre"], "a": 0, "f": "La fotogrametría ofrece cobertura densa y rápida; la conveniencia depende del objetivo y control."}, {"q": "¿Qué mide directamente el NDVI respecto al agua del suelo?", "o": ["La humedad volumétrica a 30 cm", "Nada directamente; refleja respuesta de vegetación relacionada con múltiples factores", "El volumen de agua disponible en el perfil"], "a": 1, "f": "NDVI no es un sensor de humedad de suelo ni mide directamente requerimientos de riego."}, {"q": "¿Qué diferencia hay entre humedad del suelo y evapotranspiración?", "o": ["Son sinónimos", "La humedad describe agua contenida en el suelo; la evapotranspiración es pérdida de agua por evaporación y transpiración", "La evapotranspiración solo mide lluvia"], "a": 1, "f": "Son variables distintas: estado de agua en suelo frente a flujo de pérdida de agua."}, {"q": "¿Qué instrumento puede medir humedad volumétrica del suelo?", "o": ["Sensor de humedad calibrado, por ejemplo capacitivo o TDR", "Índice NDVI del dron", "Receptor GNSS RTK"], "a": 0, "f": "Los sensores de humedad adecuados y calibrados miden el contenido volumétrico de agua."}, {"q": "¿Por qué importa la textura del suelo al planificar el riego?", "o": ["Determina por sí sola la dosis exacta sin más datos", "Influye en retención, infiltración y disponibilidad de agua", "No tiene relación con el movimiento del agua"], "a": 1, "f": "Textura condiciona propiedades hídricas, pero debe combinarse con profundidad, estructura y demanda."}, {"q": "¿Cómo influye la pendiente en el riego?", "o": ["Puede afectar escorrentía, distribución e infiltración del agua", "No influye en ningún sistema", "Solo afecta el color de las hojas"], "a": 0, "f": "La pendiente puede generar escorrentía y diferencias de aplicación, dependiendo del sistema."}, {"q": "¿Qué aporta combinar mapas topográficos y multiespectrales?", "o": ["Permite inferir sin validación la causa de cada anomalía", "Permite relacionar patrones del cultivo con condiciones del terreno y priorizar verificaciones", "Sustituye sensores de humedad"], "a": 1, "f": "La integración ayuda a formular hipótesis espaciales, que deben validarse con datos de campo."}, {"q": "¿Qué representa ETo?", "o": ["Evapotranspiración de referencia bajo una superficie de referencia", "El agua almacenada en una hoja", "La humedad del suelo a capacidad de campo"], "a": 0, "f": "ETo representa la demanda evaporativa de la atmósfera sobre una superficie de referencia."}, {"q": "¿Cómo se estima comúnmente la evapotranspiración del cultivo (ETc)?", "o": ["ETc = ETo × Kc", "ETc = NDVI + pendiente", "ETc = lluvia × textura"], "a": 0, "f": "La relación estándar es ETc = ETo por coeficiente de cultivo Kc, con ajustes según el método."}, {"q": "¿Qué representa Kc?", "o": ["La presión del sistema de riego", "El coeficiente de cultivo que relaciona ETc con ETo", "El índice de reflectancia red edge"], "a": 1, "f": "Kc varía según cultivo, etapa fenológica y condiciones de manejo."}, {"q": "¿Qué se necesita para decidir si una zona requiere más riego?", "o": ["Solo un NDVI bajo", "Solo la pendiente", "Humedad del suelo, demanda del cultivo, suelo, etapa fenológica y desempeño del sistema"], "a": 2, "f": "La decisión requiere integrar estado hídrico, demanda, suelo y uniformidad del riego."}, {"q": "¿Qué caracteriza al riego de tasa variable?", "o": ["Ajustar espacialmente el aporte de agua según zonas y un sistema de control compatible", "Aplicar el mismo volumen en todo el predio", "Pulverizar fertilizante con un dron"], "a": 0, "f": "VRI modifica la aplicación de agua espacialmente mediante infraestructura y controladores compatibles."}, {"q": "Dos sectores tienen NDVI similar, pero uno es arenoso y otro arcilloso. ¿Deben recibir necesariamente la misma lámina?", "o": ["Sí, porque NDVI es igual", "No necesariamente; las propiedades de retención e infiltración pueden ser distintas", "Sí, porque textura no afecta el agua"], "a": 1, "f": "La textura influye en almacenamiento y movimiento del agua; la dosis requiere más datos."}, {"q": "¿Qué representa un mapa de prescripción?", "o": ["Un mapa de colores sin referencia espacial", "Una instrucción georreferenciada para variar una operación o dosis", "Un ortomosaico sin interpretación"], "a": 1, "f": "El mapa traduce zonas y dosis/acciones a una instrucción utilizable por equipos compatibles."}, {"q": "¿Cómo se puede construir un mapa de prescripción desde índices?", "o": ["Clasificando zonas, validando causas y asignando recomendaciones/dosis con criterio agronómico", "Asignando dosis altas a todos los píxeles rojos", "Copiando el NDVI como si fuera una dosis"], "a": 0, "f": "Se necesita zonificación, validación, reglas agronómicas y conversión a formato compatible."}, {"q": "¿Qué diferencia hay entre mapa diagnóstico y mapa de prescripción?", "o": ["El diagnóstico describe condiciones; la prescripción indica una acción o dosis", "El diagnóstico siempre es una dosis", "No existe diferencia"], "a": 0, "f": "El diagnóstico caracteriza; la prescripción convierte la interpretación en una instrucción operativa."}, {"q": "¿Qué información adicional hace falta para prescribir fertilización?", "o": ["Solo NDVI", "Análisis de suelo/foliar, requerimiento del cultivo, etapa, rendimiento objetivo y criterio agronómico", "Solo altura del vuelo"], "a": 1, "f": "La dosis depende de necesidades, disponibilidad, extracción, suelo y objetivos productivos."}, {"q": "¿Qué debe verificarse antes de exportar un mapa a un equipo agrícola?", "o": ["Compatibilidad de formato, sistema de coordenadas, resolución y software/controlador", "Únicamente el color de la leyenda", "Que el archivo tenga el mayor tamaño posible"], "a": 0, "f": "La compatibilidad técnica determina si el equipo interpreta correctamente la prescripción."}, {"q": "¿Pueden todos los drones Agras usar cualquier mapa generado por cualquier software?", "o": ["Sí, todos aceptan cualquier formato", "No; depende del modelo, firmware, software y flujo de trabajo compatible", "Solo necesitan una imagen JPG"], "a": 1, "f": "La compatibilidad depende del equipo y de la plataforma de prescripción."}, {"q": "¿Qué limitación tiene una aplicación de tasa variable basada únicamente en NDVI?", "o": ["NDVI no indica por sí solo la causa ni la dosis apropiada", "NDVI siempre mide nutrientes exactos", "No se necesita calibrar el equipo"], "a": 0, "f": "El índice no define dosis; requiere diagnóstico, calibración y recomendación técnica."}, {"q": "¿Qué diferencia hay entre aplicación variable de productos y riego VRI?", "o": ["Ambas son idénticas y usan los mismos equipos", "Una regula aplicación de insumos; la otra controla el aporte de agua mediante infraestructura de riego", "VRI es el nombre de una banda espectral"], "a": 1, "f": "Son operaciones distintas y requieren equipos y sistemas de control diferentes."}, {"q": "¿Cómo se valida en campo un patrón observado en índices?", "o": ["Visitar zonas representativas y medir/observar variables pertinentes", "Suponer que el mapa es correcto", "Aplicar el mismo tratamiento a toda la finca"], "a": 0, "f": "La validación debe incluir observaciones y mediciones relacionadas con la hipótesis."}, {"q": "¿Qué variable fisiológica puede complementar índices espectrales?", "o": ["Contenido relativo de clorofila medido con instrumento apropiado", "Coordenada UTM del árbol", "Presión de neumáticos del tractor"], "a": 0, "f": "La clorofila puede complementar la interpretación espectral, con mediciones adecuadas."}, {"q": "¿Qué relación general existe entre clorofila y respuesta espectral?", "o": ["La clorofila absorbe fuertemente ciertas longitudes de onda visibles, influyendo en la reflectancia", "La clorofila solo refleja microondas", "No existe relación"], "a": 0, "f": "Los pigmentos fotosintéticos afectan la absorción y reflectancia en bandas visibles."}, {"q": "¿Cómo puede afectar el estrés hídrico a la planta?", "o": ["Puede alterar apertura estomática, fotosíntesis y crecimiento", "Siempre aumenta la fotosíntesis", "Solo cambia la posición GNSS"], "a": 0, "f": "El déficit hídrico puede reducir conductancia estomática y actividad fotosintética."}, {"q": "¿El NDRE mide directamente el nitrógeno foliar?", "o": ["Sí, entrega concentración exacta en porcentaje", "No; puede relacionarse con propiedades de la vegetación, pero requiere calibración para estimar nutrientes", "Mide nitró
